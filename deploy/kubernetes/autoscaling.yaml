apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: duke-agent-fabric
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: duke-agent-fabric
  minReplicas: 3
  maxReplicas: 12
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: duke-agent-fabric
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: duke-agent-fabric
