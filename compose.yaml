name: duke-agent-fabric

services:
  api:
    build:
      context: .
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:size=128m,noexec,nosuid,nodev
    ports:
      - "127.0.0.1:${DUKE_PORT:-9090}:9090"
    environment:
      DUKE_ENVIRONMENT: production
      DUKE_HOST: 0.0.0.0
      DUKE_PORT: 9090
      DUKE_DATABASE_URL: mysql+pymysql://duke:${MYSQL_PASSWORD}@mysql:3306/duke?charset=utf8mb4
      DUKE_REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      DUKE_STORAGE_ALLOWED_HOSTS: mysql,redis
      DUKE_SHORT_TERM_RETENTION_DAYS: "7"
      DUKE_LONG_TERM_RETENTION_DAYS: "365"
      DUKE_OPA_URL: http://opa:8181
      DUKE_OPA_ALLOWED_HOSTS: opa
      DUKE_OPA_FAILURE_MODE: closed
      DUKE_OPA_EMBEDDED_DEVELOPMENT_FALLBACK: "false"
      DUKE_AUTH_MODE: oidc
      DUKE_OIDC_ISSUER: ${DUKE_OIDC_ISSUER}
      DUKE_OIDC_AUDIENCE: ${DUKE_OIDC_AUDIENCE:-duke-agent-fabric}
      DUKE_OIDC_JWKS_URL: ${DUKE_OIDC_JWKS_URL}
      DUKE_OIDC_ALLOWED_HOSTS: ${DUKE_OIDC_ALLOWED_HOSTS}
      DUKE_MODEL_API_BASE: ${DUKE_MODEL_API_BASE}
      DUKE_MODEL_API_KEY: ${DUKE_MODEL_API_KEY}
      DUKE_MODEL_NAME: ${DUKE_MODEL_NAME}
      DUKE_MODEL_FALLBACKS: ${DUKE_MODEL_FALLBACKS:-}
      DUKE_MODEL_ALLOWED_HOSTS: ${DUKE_MODEL_ALLOWED_HOSTS}
      DUKE_EXPOSE_LEGACY_API: "false"
      LANGCHAIN_TRACING_V2: "false"
      LANGSMITH_TRACING: "false"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      opa:
        condition: service_healthy
    networks:
      - frontend
      - control-plane

  mysql:
    image: mysql:8.4.11
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
      - --local-infile=0
    environment:
      MYSQL_DATABASE: duke
      MYSQL_USER: duke
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./deploy/mysql/001-schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: [CMD-SHELL, "mysqladmin ping -h 127.0.0.1 -u duke -p$${MYSQL_PASSWORD} --silent"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
    networks:
      - control-plane

  redis:
    image: redis:8.2.9-bookworm
    restart: unless-stopped
    command: [redis-server, --appendonly, "yes", --maxmemory-policy, noeviction, --requirepass, "${REDIS_PASSWORD}"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: [CMD-SHELL, "redis-cli -a '$${REDIS_PASSWORD}' --no-auth-warning ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks:
      - control-plane

  opa:
    image: openpolicyagent/opa:1.20.1
    restart: unless-stopped
    command: [run, --server, --addr=0.0.0.0:8181, --log-format=json, /policies]
    volumes:
      - ./policies:/policies:ro
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:size=32m,noexec,nosuid,nodev
    healthcheck:
      test: [CMD, /opa, eval, "true"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - control-plane

volumes:
  mysql-data:
  redis-data:

networks:
  frontend:
  control-plane:
    internal: true
