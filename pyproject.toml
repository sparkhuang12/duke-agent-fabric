[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "duke-agent-fabric"
version = "0.3.0"
description = "Sovereign, policy-governed multi-agent runtime built on LangGraph"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Duke Agent contributors" }]
dependencies = [
  "anyio>=4.8,<4.11",
  "fastapi>=0.116,<1",
  "httpx>=0.27,<1",
  "langchain>=1.0,<2",
  "langchain-core>=1.0,<2",
  "langchain-openai>=1.0,<2",
  "langgraph>=1.0,<2",
  "langgraph-checkpoint-sqlite>=3.0,<4",
  "mcp>=1.27,<2",
  "prometheus-client>=0.21,<1",
  "PyJWT[crypto]>=2.10,<3",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "structlog>=24.4,<27",
  "tenacity>=8.2,<10",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
postgres = [
  "langgraph-checkpoint-postgres>=3.0,<4",
  "psycopg[binary,pool]>=3.2,<4",
]
production = [
  "langgraph-checkpoint-redis>=0.5.2,<0.6",
  "PyMySQL>=1.1,<2",
  "redis>=7.4,<8",
  "SQLAlchemy>=2.0,<3",
]
dev = [
  "coverage[toml]>=7.6,<8",
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "fakeredis>=2.31,<3",
  "ruff>=0.9,<1",
]

[project.scripts]
duke-agent-fabric = "duke_harness.cli:main"
duke-harness = "duke_harness.cli:main"
duke-office-mcp = "duke_harness.mcp.office_server:main"
duke-maintenance = "duke_harness.maintenance:main"

[tool.hatch.build.targets.wheel]
packages = ["src/duke_harness", "backend"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["duke_harness"]
