<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f3e9">
  <meta name="description" content="Duke 山海手卷，在章回、人物和伏笔之间写作与续写中文长篇小说。">
  <meta property="og:image" content="./assets/shanhai.webp">
  <title>山海手卷 · Duke 小说写作台</title>
  <link rel="icon" href="./assets/scroll-mark.png">
  <link rel="stylesheet" href="./novel.css">
  <script type="module" src="./novel.js"></script>
</head>
<body>
  <a class="skip" href="#chapterBody">跳到正文</a>
  <header class="mast">
    <a class="identity" href="./index.html"><b>Duke</b><i aria-hidden="true"></i><span>写作手卷</span></a>
    <nav aria-label="小说写作"><button id="deskTab" aria-current="page">写作台</button><button id="castTab">人物</button><button id="clueTab">伏笔</button></nav>
    <button id="shelf" class="shelf">作品书架 <span aria-hidden="true">↗</span></button>
  </header>
  <section class="scroll-cover" aria-labelledby="bookTitle">
    <img src="./assets/shanhai.webp" width="1817" height="866" alt="" fetchpriority="high">
    <div class="scroll-label"><span class="seal">长篇小说</span><h1 id="bookTitle">山海手卷</h1><p id="volumeName"></p></div>
  </section>
  <div id="notice" class="notice" role="status" hidden></div>
  <main class="mount-grid" id="desk">
    <aside class="contents">
      <div class="toc-head"><h2>章回目录</h2><button id="addChapter" class="add" aria-label="新建章节" title="新建章节">＋</button></div>
      <label class="mobile-toc" for="chapterPicker">切换章节<select id="chapterPicker"></select></label>
      <div id="chapters" class="toc" aria-label="选择章节"></div>
    </aside>
    <article class="sheet" aria-label="当前章节">
      <div class="chapter-line"><span id="chapterNumber"></span><button id="chapterSettings" class="text-control" title="编辑章名与前情提要">章节设置</button></div>
      <h2 id="chapterTitle"></h2>
      <label class="sr-only" for="chapterBody">章节正文</label>
      <textarea id="chapterBody" rows="5" placeholder="在这里写下第一句……" spellcheck="false" disabled></textarea>
      <footer class="writer-tools"><small id="count">正文 · 0 字</small><span id="saveState" role="status"></span><button id="check">核对前文</button><button id="continue" class="primary">续写本章</button></footer>
    </article>
    <aside class="notes">
      <section><h2>出场人物</h2><div id="sideCast"></div></section>
      <section><h2>未解伏笔</h2><div id="sideClues"></div></section>
    </aside>
  </main>
  <footer class="site-foot"><button id="connect" class="text-control">连接设置</button></footer>
  <dialog id="panel" aria-labelledby="panelTitle"><div class="dialog-head"><h2 id="panelTitle"></h2><button id="closePanel" aria-label="关闭窗口">关闭</button></div><div id="panelBody"></div></dialog>
  <noscript>请启用 JavaScript 以打开书架和编辑手稿。</noscript>
</body>
</html>
