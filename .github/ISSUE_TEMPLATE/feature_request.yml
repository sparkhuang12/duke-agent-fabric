name: Feature request
description: Propose a scoped improvement
title: "[feature] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What operator or user problem should be solved?
    validations:
      required: true
  - type: textarea
    id: boundary
    attributes:
      label: Data and authority boundary
      description: Describe new data flows, tools, permissions, retention or network access.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach
    validations:
      required: true
