name: Bug report
description: Report a reproducible non-security defect
title: "[bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not report vulnerabilities or include secrets/private data here. Follow SECURITY.md instead.
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
      description: Include sanitized errors and the affected agent/deployment profile.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
