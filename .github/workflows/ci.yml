name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[dev,production]'
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: mypy src/duke_harness
      - run: pytest
      - run: python -m json.tool deploy/keycloak/realm-duke.json >/dev/null

  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: >-
          docker run --rm -v "$PWD:/workspace" openpolicyagent/opa:1.20.1
          fmt --fail /workspace/policies
      - run: >-
          docker run --rm -v "$PWD:/workspace" openpolicyagent/opa:1.20.1
          test /workspace/policies
